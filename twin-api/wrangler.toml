name = "astrid-twin"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# The twin's voice. With a Cartesia voice id and `wrangler secret put CARTESIA_API_KEY`, Cartesia speaks (as on
# matthewpetersen.ca). Without, Workers AI does: Aura-2 for English up to AURA_DAILY_CHARS a day, then MeloTTS.
CARTESIA_VOICE_ID = ""
AURA_SPEAKER = "iris"
# Workers AI is free up to 10,000 neurons a day; Aura-2 costs about 2,727 per 1,000 characters, so ~3,650 characters.
# 3,300 leaves ~1,000 neurons for MeloTTS (about 18 an audio minute) once Aura is spent.
AURA_DAILY_CHARS = "3300"
CARTESIA_MODEL = "sonic-3.6"
MODEL = "claude-haiku-5-5"
EFFORT = "low"
# Origins allowed to call the API: the live site and `npm start`.
ALLOWED_ORIGINS = "https://kioberry.github.io,https://astridxie.github.io,http://localhost:3000"

# Workers AI: the twin's voice when Cartesia isn't set up (src/tts.js), and the #/voices samples (src/voiceLab.js).
[ai]
binding = "AI"
remote = true

# Today's Aura characters, shared by every instance (src/budget.js).
[[durable_objects.bindings]]
name = "TTS_BUDGET"
class_name = "TtsBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TtsBudget"]

# 20 questions a minute per visitor IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# 60 spoken sentences a minute per visitor IP (an answer is a few sentences).
[[ratelimits]]
name = "TTS_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60
